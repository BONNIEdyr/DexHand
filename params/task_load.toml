# 赛项 I 悬挂负载参数。电机阶段为开环计时，须实机标定。
# 位置单位：0~1000 对应 0~240°；时间单位：秒 / 毫秒。
# 硬件参数（串口、ID、min/max_position）仍在 config.toml。

[gripper]
ids = [3, 2]
mirror = true                 # 2 号电机方向与 1 号相反（镜像安装）
transport_control = "speed"   # 电机阶段用固定转速，受电压影响小；也可用 "duty"
transport_speed = -20          # 1 号张开方向速度；speed 为 1~50，duty 为 1~1000
settle_s = 0.3                # 电机停转到切换位置模式的停顿
move_time_ms = 800            # 位置模式阶段动作时间
open_time_s = 1.5             # 张开：电机阶段时长
open_position = 600           # 张开：位置模式目标；写 [a, b] 可给两只舵机不同值
close_time_s = 1.5            # 闭合：电机阶段时长
close_position = 150          # 闭合：位置模式目标（比接触点略深）
grip_duty = 400               # 闭合后沿闭合方向的占空比，决定夹紧力；0 表示不夹紧

[hold]
status_interval_s = 2.0       # 保持阶段每隔多久读一次电压、温度、位置
