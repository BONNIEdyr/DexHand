# Python 3.11+。串口与舵机硬件配置，main.py 和三个赛项脚本共用。先修改串口再运行。
[serial]
port = "COM3"                  # Windows: COM4；Linux: /dev/ttyUSB0
baudrate = 115200              # 本协议规定 115200；此项只改变电脑端串口参数
bytesize = 8
parity = "N"
stopbits = 1
timeout = 0.3                 # 每次读取应答的总超时，单位：秒
write_timeout = 0.5           # 串口写入超时，单位：秒
command_interval = 0.005      # 相邻通信之间的最小间隔，不是动作完成时间
read_retries = 1              # 读取失败后的重试次数；运动写指令不自动重发

# 每个 [[servos]] 对应一只舵机，id 为硬件 ID；程序只操作这里列出的 ID。
# min_position / max_position 是软件位置限制（0~1000 对应 0~240°），不写入舵机 EEPROM。
[[servos]]
id = 1
min_position = 0
max_position = 1000

[[servos]]
id = 2
min_position = 0
max_position = 1000

[[servos]]
id = 3
min_position = 0
max_position = 1000
